# ==============================================================================
# CẤU HÌNH NGINX CHO DỰ ÁN THIỆP CƯỚI
# Đường dẫn cấu hình trên Ubuntu/Debian thường là:
# /etc/nginx/sites-available/wedding.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# CÁCH 1 (KHUYÊN DÙNG NẾU CHẠY NODE.JS + PM2 TRÊN VPS): REVERSE PROXY
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name your-domain.com www.your-domain.com; # Thay bằng tên miền hoặc IP của bạn

    # Giới hạn kích thước body nếu có upload
    client_max_body_size 10M;

    # Gzip nén dữ liệu giúp load trang siêu nhanh
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

